<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Science Search AI</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #0b132b;
      color: white;
      text-align: center;
      padding: 40px;
    }

    h1 {
      color: #5bc0be;
    }

    input {
      width: 70%;
      padding: 12px;
      font-size: 16px;
      border-radius: 5px;
      border: none;
      outline: none;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      margin-left: 10px;
      border: none;
      border-radius: 5px;
      background: #5bc0be;
      cursor: pointer;
    }

    button:hover {
      background: #3a86ff;
      color: white;
    }

    #result {
      margin-top: 30px;
      text-align: left;
      background: #1c2541;
      padding: 20px;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <h1>🔬 Science Search</h1>
  <p>Search anything related to science</p>

  <input type="text" id="searchInput" placeholder="e.g. Black holes, DNA, Quantum physics">
  <button onclick="searchScience()">Search</button>

  <div id="result"></div>

  <script>
    async function searchScience() {
      const query = document.getElementById("searchInput").value;
      const resultDiv = document.getElementById("result");

      if (!query) {
        resultDiv.innerHTML = "<p>Please enter a science topic.</p>";
        return;
      }

      resultDiv.innerHTML = "Loading...";

      try {
        const response = await fetch(
          `https://en.wikipedia.org/api/rest_v1/page/summary/${encodeURIComponent(query)}`
    );
        const data = await response.json();

        if (data.extract) {
          resultDiv.innerHTML = `
            <h2>${data.title}</h2>
            <p>${data.extract}</p>
          `;
        } else {
          resultDiv.innerHTML = "<p>No science information found.</p>";
        }

      } catch (error) {
        resultDiv.innerHTML = "<p>Error fetching data.</p>";
      }
    }
  </script>

</body>
</html>
